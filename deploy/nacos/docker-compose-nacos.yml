#     environment:
#       MODE: <MODE>                              # 例：standalone
#       SPRING_DATASOURCE_PLATFORM: ""
#       JVM_XMS: <HEAP>                           # 例：256m
#       JVM_XMX: <HEAP>
#       NACOS_AUTH_ENABLE: "<true|false>"
#     ports:
#       - "<HOST_PORT>:<CONTAINER_PORT>"          # 例：8848:8848
#       - "<HOST_PORT>:<CONTAINER_PORT>"          # 例：9848:9848
#     healthcheck:
#       test: ["CMD", "curl", "-f", "http://127.0.0.1:<PORT>/nacos/"]
#       interval: 10s
#       timeout: 5s
#       retries: 30
