server:
  port: 8083

spring:
  application:
    name: bsh-order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR}
        file-extension: yaml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        eager: false
  config:
    import: optional:nacos:bsh-common.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

logging:
  level:
    com.baishuhui: INFO

bsh:
  internal:
    token: ${BSH_INTERNAL_TOKEN:bsh-local-internal-token}

---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/baishuhui

# local 下 Feign 直连兜底（Nacos 可用时仍走服务发现；url 为空则仅 discovery）
bsh:
  services:
    user: ${BSH_USER_URL:http://127.0.0.1:8081}
    supply: ${BSH_SUPPLY_URL:http://127.0.0.1:8082}
    price: ${BSH_PRICE_URL:http://127.0.0.1:8084}
  internal:
    token: ${BSH_INTERNAL_TOKEN:bsh-local-internal-token}

