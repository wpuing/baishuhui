server:
  port: 8085

spring:
  application:
    name: bsh-home-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR}
        fail-fast: false
      config:
        server-addr: ${NACOS_ADDR}
        file-extension: yaml
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        eager: false
  config:
    import: optional:nacos:bsh-common.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

bsh:
  internal:
    token: ${BSH_INTERNAL_TOKEN:bsh-local-internal-token}

logging:
  level:
    com.baishuhui: INFO

---
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      uri: mongodb://127.0.0.1:27017/baishuhui

---
spring:
  config:
    activate:
      on-profile: demo
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

